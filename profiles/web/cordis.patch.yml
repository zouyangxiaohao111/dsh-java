- id: directory-picker
  disabled: true
  # M11:web-app bundle 把 directory-picker 指向 auto(@deepseek-ai/dsh-host-directory-picker-auto,
  # 其 apply 用 ctx.loader.create —— Java LoaderService 是 no-op,挂不上 native backend → 服务
  # 缺失 → api-gateway PENDING → apiProxy 缺失 → /api 404 → web UI 无法交互)。patch 的 id
  # 定向不覆盖 name,故 insert native 后端行(Service 子类,加载即 provide directoryPicker),
  # 并禁用 auto。picker 交互是深度功能(pick 打开 OS 对话框),不触发不影响 UI 基本交互。
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      group: web
      # M11-3:后端用 browse 而非 native —— host.listDirectory 要求 capability.kind ===
      # 'browse'(api-proxy.ts:2913);native 只有 pick(打开 OS 对话框),点击"添加工作区"
      # → 目录浏览 host.listDirectory → "needs the browse capability" → HTTP 404 → 无法
      # 创建首个工作区。browse 后端零依赖(node:fs 列目录),capability = browse。
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
      group: web
      # M11-2:directory flow 槽的 client 占用者 —— M11-1 禁用 auto 后它不再被 create 进
      # loader,client 端无 "添加工作区" 入口 → 无工作区 + 无添加 → 工作区菜单空 → 点击无
      # 反应(用户"选择工作区没法选")。作为 loader entry 启用,ClientModuleRegistry 扫进
      # manifest,client 端激活注入 conversation.hero.workspace.directoryFlow slot → 菜单出现
      # "添加工作区",用户可浏览目录创建首个工作区。
- id: plugin-inventory
  group: web



