# M5 混排 profile:一份 cordis.yml 同时声明 Java 插件(java:)与 dsh JS 插件(node:),
# 由 M5ProfileTest 经 PluginLoaderService 读取、逐条注册进 registry 并断言。
#
# 格式 = dsh cordis.yml 兼容 + Java 扩展(design §2.1):
#   source: java:dev.dsh.demo.X   — Java 插件(类名,ClassLoader 加载)
#   source: node:<路径>            — dsh JS 插件,显式走 NodeWorkerJsHost
#
# node: 插件复用 agent-fusion overlay 的 node_modules(../agent-fusion,已提交)。
# 顺序即注册顺序:Java 提供者(seams)先于消费它的 agent-loop。agent-loop 内部已注册
# systemPrompt/agents/sessions 服务,故不单列 system-prompt-driver(避免 'systemPrompt'
# 重复注册)。
#
# 注:session-stats 不单列为 node: 条目 —— 它 inject fusion 的 sessionProjections,而每个
# node: 插件跑在独立 worker 进程,fusion 提供的值携带 worker 内 fn 句柄,跨 worker 无法
# 反序列化(基线静默吞掉该 apply 失败)。session-stats 由 fusion 插件内部同 worker
# mountSessionStats() 装载(见 agent-fusion/fusion-plugin);跨 worker 的 JS→JS 组合不在
# M5 范围(M5 组合验收 = Java provide → JS inject,见 design §4.3)。
plugins:
  # ---- Java 插件(2)----
  - name: counter
    source: java:dev.dsh.demo.CounterPlugin
  - name: seams
    source: java:dev.dsh.demo.SeamPlugin
  # ---- dsh JS 插件(node:,复用 agent-fusion overlay 的 node_modules)----
  - name: require-probe
    source: node:../agent-fusion/require-probe
  - name: agent-loop
    source: node:../agent-fusion/agent-loop-driver
  - name: fusion
    source: node:../agent-fusion/fusion-plugin
